name: Deploy Database Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch: {}

jobs:
  migrate:
    name: Run Drizzle Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # db:migrate (drizzle-kit migrate) applies the committed migration files
        # in order, tracked in drizzle.__drizzle_migrations. Unlike db:push it is
        # non-interactive, never truncates, and — critically — exits non-zero on
        # failure so a broken migration turns the run red instead of silently
        # passing. Prod's journal is baselined at 0010, so this runs only new
        # migrations. Requires the DATABASE_URL secret to use sslmode=no-verify
        # (the DB's SSL cert is self-signed; 'require' would fail verification).
        run: npm run db:migrate

      - name: Migration completed
        if: success()
        run: echo "Database migrations completed successfully"

      - name: Migration failed
        if: failure()
        run: |
          echo "Database migration failed!"
          echo "Please check the logs above for details."
          exit 1
